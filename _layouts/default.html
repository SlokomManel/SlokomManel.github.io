<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% feed_meta %}
{% if site.goatcounter_code and site.goatcounter_code != "" %}
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{% endif %}
</head>
<body>
{% include header.html %}
<main class="wrap">
{{ content }}
</main>
{% include footer.html %}
<script>
(function(){
  var btn=document.getElementById('theme-toggle');
  var root=document.documentElement;
  var saved=localStorage.getItem('theme');
  if(saved){root.setAttribute('data-theme',saved);}
  function label(){
    var t=root.getAttribute('data-theme');
    btn.textContent = t==='dark' ? '☀' : (t==='light' ? '☾' : '◐');
  }
  label();
  btn.addEventListener('click',function(){
    var current=root.getAttribute('data-theme');
    var prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next;
    if(!current){ next = prefersDark ? 'light' : 'dark'; }
    else if(current==='dark'){ next='light'; }
    else { next='dark'; }
    root.setAttribute('data-theme',next);
    localStorage.setItem('theme',next);
    label();
  });
})();
</script>
</body>
</html>
