- date: "Oct 2026"
  title: "Paper accepted at BNAIC/BeNeLearn 2026"
  body: >-
    "Methodological Choices for Clustering-based Analysis of Classification
    Errors" by Mana Douma, Emma Beauxis-Aussalet, and Manel Slokom was accepted
    as a poster at BNAIC/BeNeLearn 2026.

- date: "Oct 2026"
  title: "SynIRgy to join ACM Web Conference 2027"
  body: >-
    Excited to announce that SynIRgy, the Workshop on Simulation and
    Synthetic Data for Information Retrieval, will return for a new edition
    at the ACM Web Conference 2027, following its successful debut at ECIR 2026.

- date: "Aug 2026"
  title: "Joined Hotelschool The Hague as Lecturer"
  body: >-
    Started as Lecturer at Hotelschool The Hague, teaching Data Analytics
    and Research, and contributing to the Hospitality Research Lab course
    and the maker space (AR/VR, 3D printing).

- date: "Jul 2026"
  title: "Best Paper Award at KES-HCIS"
  body: >-
    "LLMDiRec: LLM-Enhanced Intent Diffusion for Sequential Recommendation"
    (with Bo Chen) received the Best Paper Award at the KES International
    Conference on Human-Centered Intelligent Systems (KES-HCIS).

- date: "Apr 2026"
  title: "Co-organized the First SynIRgy Workshop at ECIR 2026"
  body: >-
    Co-organized SynIRgy, the First Workshop on Simulation and Synthetic
    Data for Information Retrieval, held in Delft, the Netherlands,
    as part of ECIR 2026.

- date: "2025"
  title: "Paper accepted at ECIR 2025"
  body: >-
    "How to Diversify Any Personalized Recommender?" (with Savvina Danil
    and Laura Hollink) accepted at ECIR 2025.

- date: "Nov 2024"
  title: "Visiting researcher talk at INRIA Saclay"
  body: >-
    Gave an invited talk, "How to Diversify Any Personalized Recommender?",
    as a visiting researcher with the CEDAR Group at INRIA Saclay, France.

- date: "2024"
  title: "Won the IAOS Prize for Young Statisticians"
  body: >-
    "From COACH to COACH+: Automating Output Checking with Human-in-the-Loop"
    (Statistical Journal of the IAOS) won the IAOS Prize for Young
    Statisticians.

- date: "2024"
  title: "PhD completed at TU Delft"
  body: >-
    Defended the PhD dissertation "Towards Purpose-Aware Privacy-Preserving
    Techniques for Predictive Applications" at Delft University of
    Technology.

- date: "Oct 2023"
  title: "Talk at the Brinkhof AI Symposium"
  body: >-
    Spoke on "Responsible Machine Learning and Recommender Systems" at the
    Brinkhof AI Symposium & Internet Thesis Award.

- date: "2021"
  title: "Co-organized SimuRec at ACM RecSys"
  body: >-
    Co-organized SimuRec, the First Workshop on Simulation and Synthetic
    Data for Recommender Systems Research, at ACM RecSys 2021, and served
    as Student Volunteer Co-Chair.
